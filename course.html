    <script>

        // Fetch images and assign them to elements with class 'dynamic-img'

        fetch('https://picsum.photos/v2/list?page=1&limit=100')
            .then(res => res.json())
            .then(data => {
                const imgs = document.querySelectorAll('.dynamic-img');
                imgs.forEach((img, i) => {
                    // Use modulo operator to cycle through images if there are more elements than images
                    const dataIndex = img.dataset.index ? parseInt(img.dataset.index) : i;
                    const imageIndex = dataIndex % data.length;

                    if (data[imageIndex]) {
                        // Add timestamp to avoid caching issues
                        img.src = `${data[imageIndex].download_url}?${Date.now()}`;
                        img.alt = data[imageIndex].author; // Use author name as alt text
                    }
                });
            })
            .catch(err => {
                console.error('Image API error:', err);
                // Fallback to local images if API fails
                document.querySelectorAll('.dynamic-img').forEach(img => {
                    if (!img.src.includes('assets/images/')) {
                        img.src = 'assets/images/course_1.png';
                    }
                });
            });
    </script>

    <script>
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('navbar-container').innerHTML = html);

        fetch('footer.html')
            .then(res => res.text())
            .then(html => document.getElementById('footer-container').innerHTML = html);

        document.addEventListener("DOMContentLoaded", function () {
            const checkNavbarLoaded = setInterval(() => {
                const navLinks = document.querySelectorAll(".navbar-nav .nav-link");
                if (navLinks.length > 0) {
                    clearInterval(checkNavbarLoaded);

                    const currentPage = window.location.pathname.split("/").pop();
                    navLinks.forEach(link => {
                        const href = link.getAttribute("href");
                        if (href === currentPage) {
                            link.classList.add("active-nav");
                        }
                    });

                    const sideLinks = document.querySelectorAll(".sidenav-links a");
                    sideLinks.forEach(link => {
                        const href = link.getAttribute("href");
                        if (href === currentPage) {
                            link.classList.add("active-side");
                        }
                    });
                }
            }, 50);
        });
    </script>
