<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ========== Meta Tags ========== -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="RahiTech It Solutions" name="description">
    <!-- ========== Page Title ========== -->
    <title>RahiTech</title>
    <!-- ========== Favicon Icon ========== -->
    <link href="assets/images/favicon.png" rel="shortcut icon" type="image/x-icon">
    <!-- ========== Google Fonts ========== -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,800&display=swap" rel="stylesheet">
    <!-- ========== Start Stylesheet ========== -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="assets/css/slick.css" rel="stylesheet" type="text/css">
    <link href="assets/css/slick-theme.css" rel="stylesheet" type="text/css">
    <link href="assets/css/animate.min.css" rel="stylesheet">
    <link href="assets/css/aos.css" rel="stylesheet">
    <link href="assets/css/jquery.fancybox.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/themify-icons.css">
    <link href="assets/css/style.css" rel="stylesheet">
    <script>
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('navbar-container').innerHTML = html);

        fetch('footer.html')
            .then(res => res.text())
            .then(html => document.getElementById('footer-container').innerHTML = html);

        document.addEventListener("DOMContentLoaded", function () {
            const checkNavbarLoaded = setInterval(() => {
                const navLinks = document.querySelectorAll(".navbar-nav .nav-link");
                if (navLinks.length > 0) {
                    clearInterval(checkNavbarLoaded);

                    const currentPage = window.location.pathname.split("/").pop();
                    navLinks.forEach(link => {
                        const href = link.getAttribute("href");
                        if (href === currentPage) {
                            link.classList.add("active-nav");
                        }
                    });

                    const sideLinks = document.querySelectorAll(".sidenav-links a");
                    sideLinks.forEach(link => {
                        const href = link.getAttribute("href");
                        if (href === currentPage) {
                            link.classList.add("active-side");
                        }
                    });
                }
            }, 50);
        });
    </script>
</head>

<body>
    <!--start preloader-->
    <div class="preloader">
        <div class="spinner">
            <div class="double-bounce1"></div>
            <div class="double-bounce2"></div>
        </div>
    </div>
    <!--end preloader-->
    <div class="page-wrapper">
        <!-- start Navbar -->
        <div id="navbar-container"></div>
        <!-- end Navbar -->
        <!-- start inner banner -->
        <section class="inner-banner">
            <h1 class="fw-bold text-center">Our Blog & News</h1>
        </section>
        <!-- end inner-banner -->
        <!-- start blog -->
        <section class="blog-block">
            <div class="container">
                <div class="sec-title text-center mb-3" data-aos="fade-up" data-aos-duration="1000">
                    <span class="title">BLOG & NEWS</span>
                    <h2>We keep you always updated with</h2>
                    <div class="divider">
                        <span class="fa fa-mortar-board"></span>
                    </div>
                </div>
                <div class="row" id="blog-list">
                    <!-- Dynamic Blogs will be loaded here -->
                </div>
            </div>
        </section>
        <!-- end blog -->
        <!-- start footer -->
        <div id="footer-container"></div>
        <!-- end footer -->
        <a href="#" id="scroll">
            <span></span>
        </a>
    </div>
    <!-- ===============jQuery Frameworks============= -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/slick.min.js"></script>
    <script src="assets/js/jquery.fancybox.min.js"></script>
    <script src="assets/js/aos.js"></script>
    <script src="assets/js/blog.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
